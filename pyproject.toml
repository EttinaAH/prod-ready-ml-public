[project]
name = "animal-shelter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "pyspark>=3.5.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
    "prometheus-client>=0.21.0",
    "cli",
]

[project.scripts]
animal-shelter = "animal_shelter:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "shelter-app",
    "httpx2>=2.16.2",
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
exclude = [
    ".git",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
     ".venv"
     ]

[tool.ruff.lint]
extend-select = [
  "UP", # pyupgrade
  "D",  # pydocstyle
  "N",  # PEP8 names
  "I"  # isort
]
ignore = ['D100', 'D103']

[tool.uv.workspace]
members = [
    "cli",
    "packages/cli",
    "packages/shelter_app",
]

[tool.uv.sources]
cli = { workspace = true }
shelter-app = { workspace = true }
